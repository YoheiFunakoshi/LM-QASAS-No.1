[build-system]
requires = ["setuptools>=78.1.0"]
build-backend = "setuptools.build_meta"

[project]
name = "lm-qasas-local"
version = "0.2.0"
description = "Local LM-QASAS CSV analysis, AbLang2 inference, K-means and candidate selection"
requires-python = ">=3.12"

[tool.setuptools.packages.find]
where = ["src"]
